<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Order by DM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Marcellus&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/world.css">
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div>
      <h1>Order in one message</h1>
      <p class="lead">Fill in the details once. We write the message for you, copy it, and open our Instagram chat. Paste and send.</p>
      <p class="small muted">The studio gets every order in the same format, so there are no back-and-forth questions.</p>
    </div>
    <div class="art" id="art"></div>
  </section>
  <div class="split section">
    <form class="panel" id="f" novalidate>
      <div class="field"><label for="set">Set</label><select id="set"></select></div>
      <div class="row">
        <div class="field"><label for="l1">Name on the balloon</label><input id="l1" maxlength="24"></div>
        <div class="field"><label for="l2">Second line</label><input id="l2" maxlength="24"></div>
      </div>
      <div class="field"><label for="col">Colors or theme</label><input id="col" placeholder="Blush and cream, mermaid, trucks"></div>
      <div class="row">
        <div class="field"><label for="date">Date</label><input id="date" type="date" required><div class="readout" id="dout" aria-live="polite"></div></div>
        <div class="field"><label for="how">Pickup or delivery</label><select id="how"><option>Pickup in Studio City</option><option>Delivery</option></select></div>
      </div>
      <div class="field hide" id="zipf"><label for="zip">Delivery ZIP</label><input id="zip" inputmode="numeric" maxlength="5"><div class="readout" id="zout" aria-live="polite"></div></div>
    </form>
    <div class="sticky">
      <div class="panel">
        <span class="label">Your message</span>
        <p id="msg" style="white-space:pre-line;font-size:16px;margin:0"></p>
        <div class="sum" id="sum"></div>
        <p class="readout bad" id="err" aria-live="assertive"></p>
        <div class="row" style="gap:10px">
          <button type="button" class="btn" id="copy">Copy and open Instagram</button>
          <a class="btn line" id="sms" href="#">Send by text</a>
        </div>
        <p class="readout" id="cout" aria-live="polite"></p>
      </div>
    </div>
  </div>
</main>
<script src="../assets/shop.js"></script>
<script>
Shop.chrome(5);
var sel = document.getElementById("set"), z = null, ds = null;
Shop.CATALOG.forEach(function (p) { var o = document.createElement("option"); o.value = p.id; o.textContent = p.name + ", " + Shop.money(p.price); sel.appendChild(o); });
var $ = function (id) { return document.getElementById(id); };
$("date").min = Shop.todayISO(1);
function text() {
  var p = Shop.byId(sel.value), del = $("how").value === "Delivery";
  return "Hi! I would like to order:\n" + p.name + " (" + Shop.money(p.price) + ")\nName: " + ($("l1").value || "-") + ($("l2").value ? " / " + $("l2").value : "") + "\nColors: " + ($("col").value || "your choice") + "\nDate: " + ($("date").value || "-") + "\n" + (del ? "Delivery to " + ($("zip").value || "-") : "Pickup in Studio City");
}
function draw() {
  var p = Shop.byId(sel.value), del = $("how").value === "Delivery";
  $("zipf").classList.toggle("hide", !del);
  $("art").innerHTML = Shop.art(Object.assign({}, p.art, { line1: $("l1").value || p.art.line1, line2: ($("l2").value || p.art.line2 || "").toUpperCase() }));
  $("msg").textContent = text();
  var fee = del ? (z && z.fee) : 0;
  $("sum").innerHTML = "<div><span>" + p.name + "</span><span>" + Shop.money(p.price) + "</span></div><div><span>" + (del ? "Delivery" : "Pickup") + "</span><span>" + (del ? (z ? (z.fee === null ? "Quoted in chat" : Shop.money(fee)) : "Enter ZIP") : "Free") + '</span></div><div class="t"><span>Estimated total</span><span>' + Shop.money(p.price + (fee || 0)) + "</span></div>";
  $("sms").href = "sms:?&body=" + encodeURIComponent(text());
}
["set", "l1", "l2", "col", "how"].forEach(function (id) { $(id).oninput = $(id).onchange = draw; });
$("zip").oninput = function () { z = Shop.zoneFor($("zip").value); $("zout").innerHTML = z ? '<span class="' + (z.fee === null ? "warn" : "ok") + '">' + z.name + (z.fee === null ? ", quoted in chat" : ": " + Shop.money(z.fee)) + "</span>" : ""; draw(); };
$("date").oninput = $("date").onchange = function () { ds = Shop.dayStatus($("date").value); $("dout").innerHTML = ds ? '<span class="' + ds.s + '">' + ds.t + "</span>" : ""; draw(); };
$("copy").onclick = function () {
  var e = !$("l1").value.trim() ? "Add the name for the balloon." : !ds || ds.s === "bad" ? "Choose an available date." : $("how").value === "Delivery" && !z ? "Add the delivery ZIP." : "";
  $("err").textContent = e; if (e) return;
  var t = text();
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { $("cout").innerHTML = '<span class="ok">Message copied. Paste it in the chat.</span>'; }, function () { $("cout").textContent = "Copy the message above, then paste it in the chat."; });
  window.open("https://ig.me/m/balloonatelier.la", "_blank", "noopener");
};
draw();
</script>
</body>
</html>
