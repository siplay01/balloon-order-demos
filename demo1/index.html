<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Balloon Atelier Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Marcellus&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/world.css">
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div>
      <h1>Personalized balloons, made by hand in Studio City</h1>
      <p class="lead">Their name, their colors, their favorite things. Choose a set, add the lettering, and pick it up or have it delivered across Los Angeles.</p>
      <p><a class="btn" href="#shop">Shop the sets</a></p>
    </div>
    <div class="art" id="heroArt"></div>
  </section>

  <section class="section" id="shop" aria-labelledby="sh">
    <h2 id="sh">The sets</h2>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="section hide" id="pd" aria-labelledby="pdn">
    <div class="split">
      <div class="art sticky" id="pdArt"></div>
      <div>
        <h2 id="pdn"></h2>
        <p class="muted" id="pdd"></p>
        <p class="price" id="pdp" style="font:400 24px var(--serif)"></p>
        <div class="field"><label for="l1">Name or main word</label><input id="l1" maxlength="24"></div>
        <div class="field"><label for="l2">Second line (optional)</label><input id="l2" maxlength="24" placeholder="IS ONE, HAPPY BIRTHDAY"></div>
        <div class="field"><span class="label" id="pl">Colors, pick up to 2</span><div class="swatches" role="group" aria-labelledby="pl" id="pal"></div><div class="readout muted" id="palOut"></div></div>
        <button type="button" class="btn block" id="add">Add to bag</button>
      </div>
    </div>
  </section>

  <section class="section hide" id="bagSec" aria-labelledby="bg">
    <div class="split">
      <div><h2 id="bg">Your bag</h2><ul class="list" id="bag"></ul></div>
      <div class="panel" id="co"></div>
    </div>
  </section>
  <section class="section done" id="done"></section>
</main>
<script src="../assets/shop.js"></script>
<script>
Shop.chrome(1);
var TABS = [["all", "All"], ["her", "For her"], ["him", "For him"], ["girls", "For girls"], ["boys", "For boys"], ["baby", "Baby and reveal"]];
var bag = [], cur = null, sel = { l1: "", l2: "", pal: [] };
document.getElementById("heroArt").innerHTML = Shop.art(Shop.byId("signature").art);
var tabs = document.getElementById("tabs");
TABS.forEach(function (t, i) {
  var b = document.createElement("button"); b.type = "button"; b.role = "tab"; b.textContent = t[1]; b.setAttribute("aria-selected", i === 0);
  b.onclick = function () { [].forEach.call(tabs.children, function (x) { x.setAttribute("aria-selected", x === b); }); grid(t[0]); };
  tabs.appendChild(b);
});
function grid(f) {
  var g = document.getElementById("grid"); g.innerHTML = "";
  Shop.CATALOG.filter(function (p) { return f === "all" || p.for.indexOf(f) > -1; }).forEach(function (p) {
    var b = document.createElement("button"); b.type = "button"; b.className = "product";
    b.innerHTML = '<div class="art">' + Shop.art(p.art) + "</div><b>" + p.name + "</b><span>" + p.desc + '</span><span class="price">' + Shop.money(p.price) + "</span>";
    b.onclick = function () { open(p); }; g.appendChild(b);
  });
}
function open(p) {
  cur = p; sel = { l1: p.art.line1 || "", l2: p.art.line2 || "", pal: (p.art.palette || []).slice(0, 2) };
  document.getElementById("pdn").textContent = p.name; document.getElementById("pdd").textContent = p.desc; document.getElementById("pdp").textContent = Shop.money(p.price);
  document.getElementById("l1").value = sel.l1; document.getElementById("l2").value = sel.l2;
  var pal = document.getElementById("pal"); pal.innerHTML = "";
  Object.keys(Shop.PALETTE).forEach(function (n) {
    var s = document.createElement("button"); s.type = "button"; s.className = "sw"; s.style.background = Shop.PALETTE[n]; s.title = n; s.setAttribute("aria-label", n);
    s.onclick = function () { var i = sel.pal.indexOf(n); if (i > -1) sel.pal.splice(i, 1); else { sel.pal.push(n); if (sel.pal.length > 2) sel.pal.shift(); } draw(); };
    pal.appendChild(s);
  });
  var sec = document.getElementById("pd"); sec.classList.remove("hide"); draw(); sec.scrollIntoView({ behavior: "smooth" }); document.getElementById("pdn").setAttribute("tabindex", "-1"); document.getElementById("pdn").focus({ preventScroll: true });
}
function draw() {
  sel.l1 = document.getElementById("l1").value; sel.l2 = document.getElementById("l2").value.toUpperCase();
  var a = Object.assign({}, cur.art, { line1: sel.l1, line2: sel.l2, palette: sel.pal.length ? sel.pal : cur.art.palette });
  document.getElementById("pdArt").innerHTML = Shop.art(a);
  [].forEach.call(document.getElementById("pal").children, function (s) { s.setAttribute("aria-pressed", sel.pal.indexOf(s.title) > -1); });
  document.getElementById("palOut").textContent = sel.pal.join(" and ") || "Studio picks the colors";
}
document.getElementById("l1").oninput = draw; document.getElementById("l2").oninput = draw;
document.getElementById("add").onclick = function () {
  bag.push({ name: cur.name, price: cur.price, note: [sel.l1, sel.l2].filter(Boolean).join(" / ") + (sel.pal.length ? ", " + sel.pal.join(" + ") : "") });
  renderBag(); document.getElementById("bagSec").scrollIntoView({ behavior: "smooth" });
};
var co;
function renderBag() {
  var ul = document.getElementById("bag"); ul.innerHTML = "";
  bag.forEach(function (it, i) {
    var li = document.createElement("li");
    li.innerHTML = "<div><b style=\"font:400 18px var(--serif)\">" + Shop.esc(it.name) + '</b><br><span class="muted small">' + Shop.esc(it.note) + '</span></div><span class="price">' + Shop.money(it.price) + ' <button type="button" class="opt" style="min-height:36px;padding:6px 10px;margin-left:8px">Remove</button></span>';
    li.querySelector("button").onclick = function () { bag.splice(i, 1); renderBag(); };
    ul.appendChild(li);
  });
  document.getElementById("bagSec").classList.toggle("hide", !bag.length);
  if (bag.length && !co) co = Shop.checkout(document.getElementById("co"), { items: function () { return bag; }, doneEl: document.getElementById("done"), validate: function () { return bag.length ? "" : "Your bag is empty."; } });
  if (co) co.refresh();
}
grid("all");
</script>
</body>
</html>
