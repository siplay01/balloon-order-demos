<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Balloon Gift Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Marcellus&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/world.css">
</head>
<body>
<main class="wrap">
  <section class="hero" style="grid-template-columns:1fr">
    <div>
      <h1>Find the right balloon gift</h1>
      <p class="lead">Three quick questions, then the sets that fit. Every set carries their name.</p>
    </div>
  </section>
  <section class="panel" id="quiz" aria-live="polite"></section>
  <section class="section hide" id="res" aria-labelledby="rh">
    <h2 id="rh" tabindex="-1">Made for them</h2>
    <p class="muted" id="rs"></p>
    <div class="grid" id="grid"></div>
  </section>
  <section class="section hide" id="buy">
    <div class="split">
      <div class="art sticky" id="art"></div>
      <div class="panel">
        <h2 id="bn" tabindex="-1"></h2>
        <div class="field"><label for="l1">Their name</label><input id="l1" maxlength="24"></div>
        <div id="co"></div>
      </div>
    </div>
  </section>
  <section class="section done" id="done"></section>
</main>
<script src="../assets/shop.js"></script>
<script>
Shop.chrome(4);
var Q = [
  { k: "who", h: "Who is it for?", o: [["her", "Her"], ["him", "Him"], ["girls", "A girl"], ["boys", "A boy"], ["baby", "A baby on the way"]] },
  { k: "occ", h: "What is the moment?", o: [["bday", "Birthday"], ["shower", "Shower or reveal"], ["love", "Anniversary or love"], ["just", "Just because"]] },
  { k: "bud", h: "Budget?", o: [[120, "Up to $120"], [200, "Up to $200"], [9999, "More is fine"]] }
];
var A = {}, step = 0, cur = null;
function show() {
  var box = document.getElementById("quiz");
  if (step >= Q.length) { box.classList.add("hide"); return results(); }
  var it = Q[step];
  box.innerHTML = '<p class="muted small">' + (step + 1) + " of " + Q.length + '</p><h2 tabindex="-1">' + it.h + '</h2><div class="opts" role="group"></div>' + (step ? '<p style="margin-top:16px"><button type="button" class="opt" id="back">Back</button></p>' : "");
  it.o.forEach(function (o) { var b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.textContent = o[1]; b.setAttribute("aria-pressed", A[it.k] === o[0]); b.onclick = function () { A[it.k] = o[0]; step++; show(); }; box.querySelector(".opts").appendChild(b); });
  if (step) document.getElementById("back").onclick = function () { step--; show(); };
  box.querySelector("h2").focus();
}
function results() {
  var list = Shop.CATALOG.filter(function (p) { return p.for.indexOf(A.who) > -1; });
  if (A.who === "baby" || A.occ === "shower") list = list.filter(function (p) { return p.id === "reveal" || p.id === "bubble"; }).concat(list.length ? [] : [Shop.byId("reveal")]);
  var fit = list.filter(function (p) { return p.price <= A.bud; });
  document.getElementById("rs").textContent = fit.length ? fit.length + " set" + (fit.length > 1 ? "s" : "") + " in your budget." : "Nothing in this budget for this pick. Here are the closest sets.";
  var g = document.getElementById("grid"); g.innerHTML = "";
  (fit.length ? fit : list).sort(function (a, b) { return a.price - b.price; }).forEach(function (p) {
    var b = document.createElement("button"); b.type = "button"; b.className = "product";
    b.innerHTML = '<div class="art">' + Shop.art(p.art) + "</div><b>" + p.name + "</b><span>" + p.desc + '</span><span class="price">' + Shop.money(p.price) + "</span>";
    b.onclick = function () { buy(p); }; g.appendChild(b);
  });
  var r = document.getElementById("res"); r.classList.remove("hide");
  var re = document.createElement("p"); re.innerHTML = '<button type="button" class="btn line" style="margin-top:20px">Change answers</button>'; re.firstChild.onclick = function () { step = 0; r.classList.add("hide"); document.getElementById("buy").classList.add("hide"); document.getElementById("quiz").classList.remove("hide"); show(); }; g.after(re);
  document.getElementById("rh").focus();
}
function drawBuy() { document.getElementById("art").innerHTML = Shop.art(Object.assign({}, cur.art, { line1: document.getElementById("l1").value || cur.art.line1 })); }
var co;
function buy(p) {
  cur = p; document.getElementById("bn").textContent = p.name + ", " + Shop.money(p.price);
  document.getElementById("l1").value = ""; document.getElementById("l1").placeholder = p.art.line1; drawBuy();
  var s = document.getElementById("buy"); s.classList.remove("hide"); s.scrollIntoView({ behavior: "smooth" }); document.getElementById("bn").focus({ preventScroll: true });
  if (!co) co = Shop.checkout(document.getElementById("co"), { items: function () { return [{ name: cur.name, price: cur.price, note: document.getElementById("l1").value }]; }, validate: function () { return document.getElementById("l1").value.trim() ? "" : "Add their name for the balloon."; }, doneEl: document.getElementById("done") });
  co.refresh();
}
document.getElementById("l1").oninput = drawBuy;
show();
</script>
</body>
</html>
