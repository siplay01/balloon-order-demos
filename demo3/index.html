<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Party Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Bungee&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/world.css">
</head>
<body>
<div class="demo-strip">Demo 3 of 5: four questions, three ready packages. Name, prices and dates are placeholders. <a href="../">All demos</a></div>
<header class="sign wrap">
  <p class="name">Balloon Atelier</p>
  <p class="tag">tell us the party</p>
  <div class="pin"></div>
</header>
<main class="wrap" style="max-width:820px">
  <section class="board" id="quiz" aria-live="polite">
    <div class="steps" id="steps" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <div id="q"></div>
  </section>
  <section class="board done" id="done"></section>
</main>
<footer class="wrap">Concept demo. No order is sent and no card is charged.</footer>
<script src="../assets/shop.js"></script>
<script>
var Q = [
  { k: "occ", h: "What is the occasion?", o: ["Kids birthday", "Adult birthday", "Baby shower", "Proposal", "Graduation", "Corporate event"] },
  { k: "spot", h: "Where will it go?", o: ["Dessert table", "Wall or backdrop", "Entrance", "Whole room"] },
  { k: "guests", h: "How many guests?", o: ["Under 20", "20 to 50", "50 to 100", "100+"] },
  { k: "budget", h: "Budget for decor?", o: ["Up to $300", "$300 to $700", "$700 to $1,500", "$1,500+"] }
];
var A = {}, step = 0, picked = null;
var PACK = {
  "Dessert table": [["Table garland", "6 ft garland over the table, 3 colors", 260, "garland", 6], ["Table + bouquet pair", "8 ft garland plus two 7-balloon bouquets", 470, "garland", 8], ["Table set", "10 ft garland, bouquets, foil number", 640, "garland", 10]],
  "Wall or backdrop": [["Garland wall", "10 ft garland on a stand", 420, "garland", 10], ["Arch backdrop", "8 ft arch with name sign", 760, "arch", 8], ["Full backdrop", "12 ft arch, panel, sign, floor clusters", 1250, "arch", 12]],
  "Entrance": [["Column pair", "Two 5 ft columns", 290, "columns", 2], ["Entrance arch", "8 ft arch at the door", 650, "arch", 8], ["Grand entrance", "Arch plus two columns", 960, "arch", 10]],
  "Whole room": [["Room fill", "40 helium ceiling balloons", 240, "bouquet", 9], ["Room set", "Ceiling fill plus 10 ft garland", 610, "garland", 10], ["Full room", "Ceiling, backdrop arch, table garland", 1480, "arch", 12]]
};
var PAL = { "Kids birthday": ["Sky", "Lemon", "Coral", "White"], "Adult birthday": ["Black", "Gold", "White"], "Baby shower": ["Sage", "White", "Blush"], "Proposal": ["Ruby", "Blush", "White"], "Graduation": ["Cobalt", "Gold", "White"], "Corporate event": ["Black", "White", "Cobalt"] };
var q = document.getElementById("q");
function bars(n) { [].forEach.call(document.getElementById("steps").children, function (s, i) { s.className = i <= n ? "on" : ""; }); }
function show() {
  bars(step);
  if (step < Q.length) {
    var it = Q[step];
    q.innerHTML = '<p class="muted small">Question ' + (step + 1) + " of " + Q.length + "</p><h2 tabindex='-1'>" + it.h + '</h2><div class="chips" role="group"></div>' + (step ? '<p style="margin-top:16px"><button class="btn small ghost" type="button" id="back">Back</button></p>' : "");
    var g = q.querySelector(".chips");
    it.o.forEach(function (o) { var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = o; b.setAttribute("aria-pressed", A[it.k] === o); b.onclick = function () { A[it.k] = o; step++; show(); }; g.appendChild(b); });
    if (step) document.getElementById("back").onclick = function () { step--; show(); };
    q.querySelector("h2").focus();
    return;
  }
  results();
}
function results() {
  var p = PACK[A.spot], pal = PAL[A.occ], cap = { "Up to $300": 300, "$300 to $700": 700, "$700 to $1,500": 1500, "$1,500+": 1e9 }[A.budget];
  var mult = { "Under 20": 1, "20 to 50": 1, "50 to 100": 1.15, "100+": 1.3 }[A.guests];
  q.innerHTML = '<h2 tabindex="-1">Three ways to do it</h2><p class="muted">' + A.occ + ", " + A.spot.toLowerCase() + ", " + A.guests.toLowerCase() + " guests. Palette suggestion: " + pal.join(", ") + '.</p><ul class="menu" id="packs"></ul><div id="book" class="hide"></div><p style="margin-top:12px"><button class="btn small ghost" type="button" id="re">Change answers</button></p>';
  var ul = document.getElementById("packs");
  p.forEach(function (x, i) {
    var price = Math.round(x[2] * (i ? mult : 1) / 5) * 5, fits = price <= cap;
    var li = document.createElement("li"); li.style.gridTemplateColumns = "88px 1fr auto";
    li.innerHTML = '<div aria-hidden="true">' + Shop.draw(x[3], pal, x[4]) + '</div><div class="what"><b>' + ["Simple", "Popular", "Showstopper"][i] + ": " + x[0] + "</b><span>" + x[1] + (fits ? "" : " &middot; above your budget") + '</span><br><button class="btn small" type="button" style="margin-top:6px">Choose</button></div><span class="price">' + Shop.money(price) + "</span>";
    li.querySelector("button").onclick = function () { picked = { name: x[0], price: price }; book(); };
    ul.appendChild(li);
  });
  document.getElementById("re").onclick = function () { step = 0; show(); };
  q.querySelector("h2").focus();
}
function book() {
  var b = document.getElementById("book"); b.classList.remove("hide");
  b.innerHTML = '<h3 style="margin-top:16px" tabindex="-1">Book: ' + picked.name + '</h3><div class="row"><div class="field"><label for="zip">Delivery ZIP</label><input id="zip" inputmode="numeric" maxlength="5" placeholder="90064"><div class="readout" id="zo"></div></div><div class="field"><label for="date">Event date</label><input id="date" type="date"><div class="readout" id="do"></div></div></div><div class="row"><div class="field"><label for="nm">Name</label><input id="nm" autocomplete="name"></div><div class="field"><label for="ph">Mobile</label><input id="ph" type="tel" autocomplete="tel"></div></div><div class="total" id="tt"></div><p class="readout bad" id="err"></p><button class="btn" type="button" id="go">Book with 30% deposit (demo)</button>';
  var z = null, ds = null;
  function tot() { var f = z && z.fee || 0, r = ds && ds.rush || 0, t = picked.price + f + r; document.getElementById("tt").innerHTML = "<div><span>" + picked.name + "</span><span>" + Shop.money(picked.price) + "</span></div><div><span>Delivery</span><span>" + (z ? (z.fee === null ? "Quoted by text" : Shop.money(f)) : "Enter ZIP") + "</span></div>" + (r ? "<div><span>Rush</span><span>" + Shop.money(r) + "</span></div>" : "") + '<div class="sum"><span>Total</span><span>' + Shop.money(t) + "</span></div>"; }
  Shop.wireZip(document.getElementById("zip"), document.getElementById("zo"), function (v) { z = v; tot(); });
  Shop.wireDate(document.getElementById("date"), document.getElementById("do"), function (v) { ds = v; tot(); });
  document.getElementById("go").onclick = function () {
    var err = document.getElementById("err");
    if (!z) return err.textContent = "Add a delivery ZIP.";
    if (!ds || ds.s === "bad") return err.textContent = "Pick an open date.";
    if (!document.getElementById("nm").value.trim() || document.getElementById("ph").value.replace(/\D/g, "").length < 10) return err.textContent = "Add your name and a 10-digit mobile number.";
    Shop.done(document.getElementById("done"), [picked.name + " for " + A.occ.toLowerCase(), "Date: " + document.getElementById("date").value, "Delivery to " + document.getElementById("zip").value]);
  };
  b.querySelector("h3").focus();
}
show();
</script>
</body>
</html>
