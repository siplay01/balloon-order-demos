<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Personalize a Balloon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Marcellus&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/world.css?v=4">
</head>
<body>
<main class="wrap">
  <section class="hero" style="padding-bottom:8px">
    <div>
      <h1>Design the Signature Set</h1>
      <p class="lead">Type the name and watch it appear on the balloon. Choose the lettering, the filling and two colors for the bouquet.</p>
    </div>
  </section>
  <div class="split">
    <div class="sticky">
      <div class="art" id="art" style="aspect-ratio:1/1.05"></div>
      <div class="sum" id="price" aria-live="polite"></div>
    </div>
    <form class="panel" id="f" novalidate>
      <div class="row">
        <div class="field"><label for="l1">Name</label><input id="l1" maxlength="24" value="Emma"></div>
        <div class="field"><label for="l2">Second line</label><input id="l2" maxlength="24" value="is twenty"></div>
      </div>
      <div class="field"><span class="label" id="stl">Lettering</span><div class="opts" role="group" aria-labelledby="stl" id="style"></div></div>
      <div class="field"><span class="label" id="inl">Lettering color</span><div class="opts" role="group" aria-labelledby="inl" id="ink"></div></div>
      <div class="field"><span class="label" id="fil">Inside the balloon</span><div class="opts" role="group" aria-labelledby="fil" id="fill"></div></div>
      <div class="field"><span class="label" id="bql">Bouquet</span><div class="opts" role="group" aria-labelledby="bql" id="bq"></div></div>
      <div class="field"><span class="label" id="pl">Bouquet colors, up to 2</span><div class="swatches" role="group" aria-labelledby="pl" id="pal"></div><div class="readout muted" id="palOut"></div></div>
      <h2 style="margin-top:24px">When and where</h2>
      <div id="co"></div>
    </form>
  </div>
  <section class="section done" id="done"></section>
</main>
<script src="../assets/shop.js?v=4"></script>
<script>
Shop.chrome(2);
var st = { style: "script", ink: "Gold", fill: "none", bq: "classic", pal: ["Deep Merlot", "Dusk Pink"] };
var OPTS = {
  style: [["script", "Script"], ["serif", "Classic"], ["sans", "Modern"]],
  ink: [["Gold", "Gold"], ["Merlot", "Merlot"], ["Black", "Black"], ["White", "White"]],
  fill: [["none", "Clear", 0], ["confetti", "Gold confetti", 10], ["pearls", "Pearls", 10], ["feathers", "Feathers", 15], ["flowers", "Dried flowers", 20]],
  bq: [["none", "Jumbo only", -40, 0], ["classic", "Classic bouquet", 0, 4], ["full", "Fuller bouquet", 30, 6]]
};
function opts(id, list) {
  var g = document.getElementById(id);
  list.forEach(function (o) {
    var b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.dataset.v = o[0];
    b.innerHTML = o[1] + (o[2] ? "<small>" + (o[2] > 0 ? "+" : "-") + Shop.money(Math.abs(o[2])) + "</small>" : "");
    b.onclick = function () { st[id] = o[0]; draw(); }; g.appendChild(b);
  });
}
Object.keys(OPTS).forEach(function (k) { opts(k, OPTS[k]); });
var pal = document.getElementById("pal");
Object.keys(Shop.PALETTE).forEach(function (n) {
  var s = document.createElement("button"); s.type = "button"; s.className = "sw"; s.style.background = Shop.PALETTE[n]; s.title = n; s.setAttribute("aria-label", n);
  s.onclick = function () { var i = st.pal.indexOf(n); if (i > -1) { if (st.pal.length > 1) st.pal.splice(i, 1); } else { st.pal.push(n); if (st.pal.length > 2) st.pal.shift(); } draw(); };
  pal.appendChild(s);
});
function pick(list, v) { for (var i = 0; i < list.length; i++) if (list[i][0] === v) return list[i]; }
function price() { return 125 + (pick(OPTS.fill, st.fill)[2] || 0) + (pick(OPTS.bq, st.bq)[2] || 0); }
var co;
function draw() {
  ["style", "ink", "fill", "bq"].forEach(function (k) { [].forEach.call(document.getElementById(k).children, function (b) { b.setAttribute("aria-pressed", b.dataset.v === st[k]); }); });
  [].forEach.call(pal.children, function (s) { s.setAttribute("aria-pressed", st.pal.indexOf(s.title) > -1); });
  document.getElementById("palOut").textContent = st.pal.join(" and ");
  var bq = pick(OPTS.bq, st.bq);
  document.getElementById("art").innerHTML = Shop.art({ kind: bq[3] ? "bouquet" : "bubble", count: bq[3], palette: st.pal, line1: document.getElementById("l1").value, line2: document.getElementById("l2").value.toUpperCase(), style: st.style, ink: st.ink, fill: st.fill });
  document.getElementById("price").innerHTML = "<div><span>Signature Set, 24-inch jumbo</span><span>$125</span></div>" +
    (st.fill !== "none" ? "<div><span>" + pick(OPTS.fill, st.fill)[1] + "</span><span>+" + Shop.money(pick(OPTS.fill, st.fill)[2]) + "</span></div>" : "") +
    (bq[2] ? "<div><span>" + bq[1] + "</span><span>" + (bq[2] > 0 ? "+" : "-") + Shop.money(Math.abs(bq[2])) + "</span></div>" : "") +
    '<div class="t"><span>Before delivery</span><span>' + Shop.money(price()) + "</span></div>";
  if (co) co.refresh();
}
document.getElementById("l1").oninput = draw; document.getElementById("l2").oninput = draw;
co = Shop.checkout(document.getElementById("co"), {
  items: function () { return [{ name: "Signature Set", price: price(), note: [document.getElementById("l1").value, document.getElementById("l2").value].filter(Boolean).join(" / ") + ", " + pick(OPTS.style, st.style)[1] + " in " + st.ink + ", " + pick(OPTS.fill, st.fill)[1] + ", " + pick(OPTS.bq, st.bq)[1] + " in " + st.pal.join(" + ") }]; },
  validate: function () { return document.getElementById("l1").value.trim() ? "" : "Type the name for the balloon."; },
  doneEl: document.getElementById("done")
});
draw();
</script>
</body>
</html>
